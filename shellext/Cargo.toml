[package]
name = "mari-encoder-menu"
version = "1.0.0"
edition = "2024"
description = "Menu de botão direito do Windows (IExplorerCommand) do Mari Encoder"
license = "GPL-3.0-or-later"

[lib]
name = "MariEncoderMenu"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-core = "0.62"
