[package]
name = "quickencoder_menu"
version = "0.1.0"
edition = "2024"
description = "Extensão do menu de contexto do Windows 11 para o QuickEncoder (IExplorerCommand)"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-core = "0.62"
