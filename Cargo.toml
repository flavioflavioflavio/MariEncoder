[package]
name = "mari-encoder"
version = "1.0.0"
edition = "2024"
description = "Mari Encoder — encode de vídeo rápido pelo menu de botão direito do Windows"
license = "GPL-3.0-or-later"
repository = "https://github.com/flavioflavioflavio/MariEncoder"
build = "build.rs"

[[bin]]
name = "MariEncoder"
path = "src/main.rs"

[workspace]
members = [".", "shellext"]
default-members = [".", "shellext"]

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_Storage_Packaging_Appx",
    "Win32_Globalization",
] }
fluent-bundle = "0.15"
unic-langid = { version = "0.9", features = ["macros"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
